name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  wasapi:
    name: MSVC Release (WASAPI only, no SDKs)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain versions
        run: >
          tools\ci\run-and-report.ps1 -Title "wasapi: toolchain" -Exe pwsh
          -ArgList '-NoProfile','-Command','cmake --version; & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property catalog_productDisplayVersion; (Get-CimInstance Win32_Processor).Name'

      - name: Configure
        run: |
          tools\ci\run-and-report.ps1 -Title "wasapi: configure" -Exe cmake -ArgList '--preset','rig'

      - name: Build Release
        run: |
          tools\ci\run-and-report.ps1 -Title "wasapi: build" -Exe cmake -ArgList '--build','--preset','rig-release' -WarningSummary

      - name: Unit tests
        run: |
          tools\ci\run-and-report.ps1 -Title "wasapi: unit tests" -Exe ctest -ArgList '--test-dir','build/rig','-C','Release','-V'

      - name: Device probe
        run: |
          tools\ci\run-and-report.ps1 -Title "wasapi: device probe" -Exe .\build\rig\tools\device_probe\Release\hc_device_probe.exe -ArgList '--no-audio-ok'

  full:
    name: Full build (ASIO + VST3, SDKs fetched at build time, never committed) + UI + installer
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Fetch ASIO SDK
        run: |
          tools\ci\run-and-report.ps1 -Title "full: fetch asio sdk" -Exe powershell -ArgList '-ExecutionPolicy','Bypass','-File','tools\fetch-asio-sdk.ps1'

      - name: Configure (ASIO + VST3)
        run: |
          tools\ci\run-and-report.ps1 -Title "full: configure" -Exe cmake -ArgList '--preset','rig-full'

      - name: Build Release (runs Steinberg's validator after the plug-in links)
        run: |
          tools\ci\run-and-report.ps1 -Title "full: build" -Exe cmake -ArgList '--build','--preset','rig-full-release' -WarningSummary

      - name: Unit tests
        run: |
          tools\ci\run-and-report.ps1 -Title "full: unit tests" -Exe ctest -ArgList '--test-dir','build/rig-full','-C','Release','-V'

      - name: VST3 validator
        run: |
          tools\ci\run-and-report.ps1 -Title "full: vst3 validator" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\run-validator.ps1','-BuildDir','build\rig-full'

      - name: Device probe
        run: |
          tools\ci\run-and-report.ps1 -Title "full: device probe" -Exe .\build\rig-full\tools\device_probe\Release\hc_device_probe.exe -ArgList '--no-audio-ok'

      - name: Software OpenGL for UI tests (Mesa llvmpipe, CI only, not shipped)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools\ci\run-and-report.ps1 -Title "ui: fetch mesa" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\fetch-mesa.ps1','-TargetDirs','build\rig-full\tools\ui_snapshot\Release,build\rig-full\app\Release'

      - name: GPU UI snapshot (live engine, 3840x2160 + 1389x868, faceplate comparison)
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          tools\ci\run-and-report.ps1 -Title "ui: snapshot" -Exe .\build\rig-full\tools\ui_snapshot\Release\hc_ui_snapshot.exe -ArgList '--out','shots','--sizes','3840x2160,1389x868','--seconds','2'

      - name: Start the real app (HybridCore.exe) and capture its window
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          tools\ci\run-and-report.ps1 -Title "app: smoke run" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\run-app-smoke.ps1','-Exe','build\rig-full\app\Release\HybridCore.exe','-Shot','shots\app_window.png'

      - name: Publish screenshots to the ci-screenshots branch
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools\ci\run-and-report.ps1 -Title "ui: publish screenshots" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\publish-screenshots.ps1','-Folder','shots'

      - name: Build installer
        run: |
          tools\ci\run-and-report.ps1 -Title "installer: build" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\build-installer.ps1'

      - name: Verify installer (install, self-test, upgrade, uninstall)
        run: |
          tools\ci\run-and-report.ps1 -Title "installer: verify" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\verify-installer.ps1','-Installer',"$env:HC_INSTALLER"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: HybridCore-Setup-${{ env.HC_VERSION }}
          path: installer/output/*.exe

      - name: Publish GitHub Release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools\ci\run-and-report.ps1 -Title "release: publish" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\publish-release.ps1'
