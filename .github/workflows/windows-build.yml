name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  wasapi:
    name: MSVC Release (WASAPI only) + GPU UI snapshot
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain versions
        run: >
          tools\ci\run-and-report.ps1 -Title "wasapi: toolchain" -Exe pwsh
          -ArgList '-NoProfile','-Command','cmake --version; & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property catalog_productDisplayVersion; (Get-CimInstance Win32_Processor).Name'

      - name: Configure
        run: |
          tools\ci\run-and-report.ps1 -Title "wasapi: configure" -Exe cmake -ArgList '--preset','rig'

      - name: Build Release
        run: |
          tools\ci\run-and-report.ps1 -Title "wasapi: build" -Exe cmake -ArgList '--build','--preset','rig-release' -WarningSummary

      - name: Unit tests
        run: |
          tools\ci\run-and-report.ps1 -Title "wasapi: unit tests" -Exe ctest -ArgList '--test-dir','build/rig','-C','Release','-V'

      - name: Device probe
        run: |
          tools\ci\run-and-report.ps1 -Title "wasapi: device probe" -Exe .\build\rig\tools\device_probe\Release\hc_device_probe.exe -ArgList '--no-audio-ok'

      - name: Software OpenGL for the UI test (Mesa llvmpipe, CI only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools\ci\run-and-report.ps1 -Title "ui: fetch mesa" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\fetch-mesa.ps1','-TargetDirs','build\rig\tools\ui_snapshot\Release'

      - name: GPU UI snapshot (render every theme, check pixels)
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          tools\ci\run-and-report.ps1 -Title "ui: snapshot 1x" -Exe .\build\rig\tools\ui_snapshot\Release\hc_ui_snapshot.exe -ArgList '--out','shots','--scale','1'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          tools\ci\run-and-report.ps1 -Title "ui: snapshot 2x" -Exe .\build\rig\tools\ui_snapshot\Release\hc_ui_snapshot.exe -ArgList '--out','shots2x','--scale','2'

      - name: Publish screenshots to the ci-screenshots branch
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools\ci\run-and-report.ps1 -Title "ui: publish screenshots" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\publish-screenshots.ps1','-Folder','shots'

  asio-compile:
    name: MSVC Release (ASIO SDK fetched at build time, never committed) + installer
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Fetch ASIO SDK
        run: |
          tools\ci\run-and-report.ps1 -Title "asio: fetch sdk" -Exe powershell -ArgList '-ExecutionPolicy','Bypass','-File','tools\fetch-asio-sdk.ps1'

      - name: Configure (ASIO required)
        run: |
          tools\ci\run-and-report.ps1 -Title "asio: configure" -Exe cmake -ArgList '--preset','rig-asio'

      - name: Build Release
        run: |
          tools\ci\run-and-report.ps1 -Title "asio: build" -Exe cmake -ArgList '--build','--preset','rig-asio-release' -WarningSummary

      - name: Unit tests
        run: |
          tools\ci\run-and-report.ps1 -Title "asio: unit tests" -Exe ctest -ArgList '--test-dir','build/rig-asio','-C','Release','-V'

      - name: Device probe
        run: |
          tools\ci\run-and-report.ps1 -Title "asio: device probe" -Exe .\build\rig-asio\tools\device_probe\Release\hc_device_probe.exe -ArgList '--no-audio-ok'

      - name: Build installer
        run: |
          tools\ci\run-and-report.ps1 -Title "installer: build" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\build-installer.ps1'

      - name: Verify installer (install, self-test, upgrade, uninstall)
        run: |
          tools\ci\run-and-report.ps1 -Title "installer: verify" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\verify-installer.ps1','-Installer',"$env:HC_INSTALLER"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: HybridCore-Setup-${{ env.HC_VERSION }}
          path: installer/output/*.exe

      - name: Publish GitHub Release (main, first build of a new VERSION)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools\ci\run-and-report.ps1 -Title "release: publish" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\publish-release.ps1'
