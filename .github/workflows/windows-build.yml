name: Windows build

on:
  workflow_dispatch:
    inputs:
      console_release:
        description: 'Publish the HEM Digital Console installer as GitHub Release console-v<console/VERSION>'
        type: boolean
        default: false

jobs:
  wasapi:
    name: MSVC Release (WASAPI only, no SDKs)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain versions
        run: >
          tools\ci\run-and-report.ps1 -Title "wasapi: toolchain" -Exe pwsh
          -ArgList '-NoProfile','-Command','cmake --version; & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property catalog_productDisplayVersion; (Get-CimInstance Win32_Processor).Name'

      - name: Configure
        run: |
          tools\ci\run-and-report.ps1 -Title "wasapi: configure" -Exe cmake -ArgList '--preset','rig'

      - name: Build Release
        run: |
          tools\ci\run-and-report.ps1 -Title "wasapi: build" -Exe cmake -ArgList '--build','--preset','rig-release' -WarningSummary

      - name: Unit tests
        run: |
          tools\ci\run-and-report.ps1 -Title "wasapi: unit tests" -Exe ctest -ArgList '--test-dir','build/rig','-C','Release','-V'

      - name: HEM Digital Console report (every measured console number)
        run: |
          tools\ci\publish-console-report.ps1 -Exe build\rig\tests\Release\hc_tests.exe

      - name: Device probe
        run: |
          tools\ci\run-and-report.ps1 -Title "wasapi: device probe" -Exe .\build\rig\tools\device_probe\Release\hc_device_probe.exe -ArgList '--no-audio-ok'

  full:
    name: Public build (WASAPI + VST3, no ASIO code) + UI + installer + public release
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Configure (VST3, no ASIO - safe to share)
        run: |
          tools\ci\run-and-report.ps1 -Title "public: configure" -Exe cmake -ArgList '--preset','rig-public'

      - name: Build Release (runs Steinberg's validator after the plug-in links)
        run: |
          tools\ci\run-and-report.ps1 -Title "public: build" -Exe cmake -ArgList '--build','--preset','rig-public-release' -WarningSummary

      - name: Unit tests
        run: |
          tools\ci\run-and-report.ps1 -Title "public: unit tests" -Exe ctest -ArgList '--test-dir','build/rig-public','-C','Release','-V'

      - name: VST3 validator
        run: |
          tools\ci\run-and-report.ps1 -Title "public: vst3 validator" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\run-validator.ps1','-BuildDir','build\rig-public'

      - name: Device probe
        run: |
          tools\ci\run-and-report.ps1 -Title "public: device probe" -Exe .\build\rig-public\tools\device_probe\Release\hc_device_probe.exe -ArgList '--no-audio-ok'

      - name: Software OpenGL for UI tests (Mesa llvmpipe, CI only, not shipped)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools\ci\run-and-report.ps1 -Title "ui: fetch mesa" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\fetch-mesa.ps1','-TargetDirs','build\rig-public\tools\ui_snapshot\Release,build\rig-public\app\Release,build\rig-public\tools\fx_snapshot\Release'

      - name: GPU UI snapshot (live engine, 3840x2160 + 1389x868, faceplate comparison)
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          tools\ci\run-and-report.ps1 -Title "ui: snapshot" -Exe .\build\rig-public\tools\ui_snapshot\Release\hc_ui_snapshot.exe -ArgList '--out','shots','--sizes','3840x2160,1389x868','--seconds','2'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          tools\ci\run-and-report.ps1 -Title "ui: snapshot with stems" -Exe .\build\rig-public\tools\ui_snapshot\Release\hc_ui_snapshot.exe -ArgList '--out','shots','--sizes','1389x868','--seconds','2','--stems','tests\data','--name','HybridCore-stems'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          tools\ci\run-and-report.ps1 -Title "ui: snapshot, dynamics page" -Exe .\build\rig-public\tools\ui_snapshot\Release\hc_ui_snapshot.exe -ArgList '--out','shots','--sizes','1389x868','--seconds','2','--stems','tests\data','--page','dyn','--name','HybridCore-dynamics'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          tools\ci\run-and-report.ps1 -Title "ui: snapshot, Beat Forge page" -Exe .\build\rig-public\tools\ui_snapshot\Release\hc_ui_snapshot.exe -ArgList '--out','shots','--sizes','3840x2160,1389x868','--seconds','3','--forge','0','--page','forge','--name','HybridCore-forge'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          tools\ci\run-and-report.ps1 -Title "ui: snapshot, ANALYZER (3D)" -Exe .\build\rig-public\tools\ui_snapshot\Release\hc_ui_snapshot.exe -ArgList '--out','shots','--sizes','3840x2160,1389x868','--seconds','6','--forge','0','--scope','--name','HybridCore-scope'

      - name: Plug-in faceplates (all 22 HEM effects + HEM WAVE, live meters)
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          tools\ci\run-and-report.ps1 -Title "ui: plug-in faceplates" -Exe .\build\rig-public\tools\fx_snapshot\Release\hc_fx_snapshot.exe -ArgList '--out','shots','--scale','0.62'

      - name: Start the real app (HybridCore.exe) and capture its window
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          tools\ci\run-and-report.ps1 -Title "app: smoke run" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\run-app-smoke.ps1','-Exe','build\rig-public\app\Release\HybridCore.exe','-Shot','shots\app_window.png'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          tools\ci\run-and-report.ps1 -Title "app: open a session from the command line" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\run-app-smoke.ps1','-Exe','build\rig-public\app\Release\HybridCore.exe','-Shot','shots\app_session.png','-StemsDir','tests\data'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          tools\ci\run-and-report.ps1 -Title "app: FX RACK with two effects" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\run-app-smoke.ps1','-Exe','build\rig-public\app\Release\HybridCore.exe','-Shot','shots\app_fxrack.png','-FxDemo'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          tools\ci\run-and-report.ps1 -Title "app: settings from an ASIO build fall back to WASAPI" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\run-app-smoke.ps1','-Exe','build\rig-public\app\Release\HybridCore.exe','-Shot','shots\app_saved_asio.png','-SavedAsio'

      - name: Publish screenshots to the ci-screenshots branch
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools\ci\run-and-report.ps1 -Title "ui: publish screenshots" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\publish-screenshots.ps1','-Folder','shots'

      - name: Build installer
        run: |
          tools\ci\run-and-report.ps1 -Title "installer: build" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\build-installer.ps1'

      - name: Verify installer (install, self-test, upgrade, uninstall)
        run: |
          tools\ci\run-and-report.ps1 -Title "installer: verify" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\verify-installer.ps1','-Installer',"$env:HC_INSTALLER"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: HybridCore-Setup-${{ env.HC_VERSION }}
          path: installer/output/*.exe

      - name: Publish GitHub Release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools\ci\run-and-report.ps1 -Title "release: publish" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\publish-release.ps1'

  console:
    name: HEM Digital Console (app, screenshots, installer)
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Steinberg ASIO SDK (from Steinberg, SHA-512 checked; used under its GPLv3 option, never committed)
        run: |
          tools\ci\run-and-report.ps1 -Title "console: asio sdk" -Exe pwsh -ArgList '-NoProfile','-File','tools\fetch-asio-sdk.ps1'

      - name: Configure (ASIO + WASAPI)
        run: |
          tools\ci\run-and-report.ps1 -Title "console: configure" -Exe cmake -ArgList '--preset','rig-asio'

      - name: Build the console app, snapshot tool, tests
        run: |
          tools\ci\run-and-report.ps1 -Title "console: build" -Exe cmake -ArgList '--build','--preset','rig-asio-release','--target','HEMDigitalConsole','hem_console_snapshot','hem_console_uitest','hc_tests','hc_device_probe' -WarningSummary

      - name: Unit tests (whole suite)
        run: |
          tools\ci\publish-console-report.ps1 -Exe build\rig-asio\tests\Release\hc_tests.exe

      - name: Software OpenGL (Mesa llvmpipe, CI only, not shipped)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools\ci\run-and-report.ps1 -Title "console: fetch mesa" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\fetch-mesa.ps1','-TargetDirs','build\rig-asio\console\app\Release'

      - name: Every faceplate, live rig, 3840x2160 + 1920x1080 + 1389x868
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          tools\ci\run-and-report.ps1 -Title "console: snapshots" -Exe .\build\rig-asio\console\app\Release\hem_console_snapshot.exe -ArgList '--out','console-shots','--sizes','3840x2160,1920x1080,1389x868','--seconds','6'

      - name: Start the real app and capture its window
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          tools\ci\run-and-report.ps1 -Title "console: app smoke run" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\run-console-smoke.ps1','-Exe','build\rig-asio\console\app\Release\HEMDigitalConsole.exe','-Shot','console-shots\app_window.png'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          tools\ci\run-and-report.ps1 -Title "console: app opens a session from the command line" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\run-console-smoke.ps1','-Exe','build\rig-asio\console\app\Release\HEMDigitalConsole.exe','-Shot','console-shots\app_session.png','-StemsDir','tests\data','-Page','4'

      - name: Every control pressed with real mouse messages (the installed-style app)
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          tools\ci\run-and-report.ps1 -Title "console: click test" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\run-console-click-test.ps1','-Exe','build\rig-asio\console\app\Release\HEMDigitalConsole.exe','-Report','console-shots\control-check.txt'

      - name: UI automation test (real clicks + keys, Windows dialogs, screen sizes and scales, save / open / crash / moved stems)
        continue-on-error: true   # its report is published either way; while the test itself is being finished it does not block the installer
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          tools\ci\run-and-report.ps1 -Title "console: UI automation test" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\run-console-uitest.ps1','-Exe','build\rig-asio\console\app\Release\HEMDigitalConsole.exe','-Test','build\rig-asio\console\app\Release\hem_console_uitest.exe','-Out','console-shots'

      - name: Publish screenshots to the console-screenshots branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools\ci\run-and-report.ps1 -Title "console: publish screenshots" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\publish-screenshots.ps1','-Folder','console-shots','-Branch','console-screenshots'

      - name: Build installer
        env:
          HEM_CONSOLE_RELEASE: ${{ inputs.console_release && '1' || '0' }}
        run: |
          tools\ci\run-and-report.ps1 -Title "console: installer build" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\build-console-installer.ps1'

      - name: Verify installer (install, self-test, app start, upgrade, uninstall)
        env:
          GH_TOKEN: ${{ github.token }}
          GALLIUM_DRIVER: llvmpipe
        run: |
          tools\ci\run-and-report.ps1 -Title "console: installer verify" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\verify-console-installer.ps1','-Installer',"$env:HEM_CONSOLE_INSTALLER"

      - name: Source code of this build, as the GPL asks (with the ASIO SDK as built)
        run: |
          tools\ci\run-and-report.ps1 -Title "console: source zip" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\make-console-source-zip.ps1'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: HEMDigitalConsole-Setup-${{ env.HEM_CONSOLE_VERSION }}
          path: installer/output/HEMDigitalConsole-Setup-*.exe

      - name: Publish GitHub Release console-v<version> (only when asked)
        if: inputs.console_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools\ci\run-and-report.ps1 -Title "console: release publish" -Exe pwsh -ArgList '-NoProfile','-File','tools\ci\publish-console-release.ps1'
