name: Hiss Tamer

# Builds ONLY the Hiss module (no app, no UI, no audio devices), runs its tests, runs the demo
# files through AUTO FIX, checks the results again with separately written Python measurements,
# and uploads the before / after / removed WAVs, pictures, and the plain-words report.
on:
  push:
    branches: ['hiss-tamer-*']
    paths: ['hiss/**', '.github/workflows/hiss-tamer.yml', 'cmake/**']
  pull_request:
    branches: ['**']
    paths: ['hiss/**', '.github/workflows/hiss-tamer.yml']
  workflow_dispatch:

jobs:
  not-main:
    name: Guard (fails if this is main)
    runs-on: ubuntu-latest
    steps:
      - name: Fail on main
        shell: bash
        run: |
          ref="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          base="${GITHUB_BASE_REF:-}"
          echo "branch=$ref base=$base"
          if [ "$ref" = "main" ]; then
            echo "Hiss Tamer work must stay on a hiss-tamer-* branch. It must never be on main."
            exit 1
          fi

  hiss:
    name: Hiss Tamer (Windows, MSVC Release)
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Branding check (no other company's names in the Hiss files)
        shell: pwsh
        run: |
          $bad = Select-String -Path (Get-ChildItem hiss -Recurse -File -Include *.hpp,*.cpp,*.py,*.md,*.txt,*.json,*.cmake,CMakeLists.txt,*.yml | ForEach-Object FullName) -Pattern '\b(ssl|waves|soundtoys|api)\b|solid state logic' -CaseSensitive:$false
          if ($bad) { $bad | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line)" }; throw "Another company's name was found." }
          Write-Host "clean"

      - name: Configure
        run: cmake -S hiss -B build/hiss -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          cmake --build build/hiss --config Release --parallel 2>&1 | Tee-Object -FilePath out\build_log.txt
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          & .\build\hiss\Release\hc_hiss_tests.exe 2>&1 | Tee-Object -FilePath out\test_log.txt
          if ($LASTEXITCODE -ne 0) { throw "tests failed ($LASTEXITCODE)" }

      - name: Lab engine tests and measuring-tool tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          & .\build\hiss\Release\hc_hiss_lab_tests.exe 2>&1 | Tee-Object -FilePath out\lab_test_log.txt
          if ($LASTEXITCODE -ne 0) { throw "lab tests failed ($LASTEXITCODE)" }
          & .\build\hiss\Release\hc_hiss_tools_tests.exe 2>&1 | Tee-Object -FilePath out\tools_test_log.txt
          if ($LASTEXITCODE -ne 0) { throw "tools tests failed ($LASTEXITCODE)" }

      - name: Window logic tests (knob, and that the knob changes what the engine does)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          & .\build\hiss\Release\hc_hiss_ui_tests.exe 2>&1 | Tee-Object -FilePath out\ui_test_log.txt
          if ($LASTEXITCODE -ne 0) {
            $why = (Get-Content out\ui_test_log.txt | Select-String -Pattern 'FAIL|info' | ForEach-Object { $_.Line }) -join ' | '
            Write-Host "::error title=window logic tests::exit $LASTEXITCODE : $why"
            exit 1
          }

      - name: Comb and Click Finder window - take pictures of the real program
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out\ui | Out-Null
          $exe = (Resolve-Path ".\build\hiss\Release\hem_comb_click.exe").Path
          function Shot($name, $argList) {
            $p = Start-Process -FilePath $exe -ArgumentList $argList -Wait -PassThru
            if ($p.ExitCode -ne 0) { Write-Host "::error title=picture $name::exit $($p.ExitCode) (2 = GDI+ did not start, 3 = picture not saved)"; exit 1 }
            if (-not (Test-Path "out\ui\$name.png")) { Write-Host "::error title=picture $name::not written"; exit 1 }
            Write-Host ("{0}: {1} bytes" -f $name, (Get-Item "out\ui\$name.png").Length)
          }
          $o = (Resolve-Path out\ui).Path
          Shot "combclick_idle"          "--snapshot `"$o\combclick_idle.png`" --idle"
          Shot "combclick_55ms_found"    "--snapshot `"$o\combclick_55ms_found.png`" --made-up 55 --period 55"
          Shot "combclick_40ms_notfound" "--snapshot `"$o\combclick_40ms_notfound.png`" --made-up 55 --period 40"
          Copy-Item $exe out\ui\hem_comb_click.exe

      - name: Publish pictures and program to the hiss-ui-shots branch
        if: github.event_name == 'push'
        continue-on-error: true
        shell: pwsh
        run: |
          function G {
            $o = & git @args 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { Write-Host "::error title=publish git $($args -join ' ')::exit $LASTEXITCODE : $($o -replace "`r?`n",' | ')"; exit 1 }
          }
          G config user.name "hem-build"
          G config user.email "hem-build@users.noreply.github.com"
          $sha = (git rev-parse --short HEAD)
          # work in a separate folder so the build folder is left exactly as it was
          $pub = Join-Path $env:RUNNER_TEMP "pub"
          G worktree add --detach $pub
          Push-Location $pub
          G checkout --orphan hiss-ui-shots
          G rm -rf . --quiet
          Copy-Item "$env:GITHUB_WORKSPACE\out\ui\*" . -Recurse
          G add -A
          G commit -m "Windows build pictures and program from $sha" --quiet
          G push -f origin hiss-ui-shots
          Pop-Location

      - name: Demo files through AUTO FIX
        shell: pwsh
        run: |
          & .\build\hiss\Release\hc_hiss_cli.exe demo out\demo 2>&1 | Tee-Object -FilePath out\demo_log.txt
          if ($LASTEXITCODE -ne 0) { throw "demo failed ($LASTEXITCODE)" }

      - name: Five tools, command line, on the demo files (smoke run, reports saved)
        shell: pwsh
        run: |
          function Fail($m) { Write-Host "::error title=hiss tools smoke::$($m -replace "`r?`n",' | ')"; exit 1 }
          $tools = (Resolve-Path ".\build\hiss\Release\hc_hiss_tools.exe").Path
          New-Item -ItemType Directory -Force out\tools | Out-Null
          $wav = Get-ChildItem out\demo -Filter *_before.wav | Select-Object -First 1
          if (-not $wav) { Fail "no demo file in out\demo" }
          foreach ($t in "scanner","combclick","airlab") {
            $o = & $tools $t $wav.FullName "out\tools\$t.md" 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { Fail "$t exit $LASTEXITCODE : $o" }
          }
          $o = & $tools proof inject comb $wav.FullName out\tools\injected.wav -80 3000 20000 5 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Fail "proof inject exit $LASTEXITCODE : $o" }
          $o = & $tools proof hash $wav.FullName out\tools\injected.wav 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Fail "proof hash exit $LASTEXITCODE : $o" }
          $o | Set-Content out\tools\hashes.txt
          $o = & $tools proof pack out\tools\pack salt1 $wav.FullName out\tools\injected.wav 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Fail "proof pack exit $LASTEXITCODE : $o" }
          # The Tamer must REFUSE with no proof file, and must not write anything.
          "" | Set-Content out\tools\empty_proof.txt
          $o = & $tools tamer $wav.FullName out\tools\tamer_refused out\tools\empty_proof.txt 2>&1 | Out-String
          if ($LASTEXITCODE -ne 3) { Fail "the Tamer did not refuse without proof (exit $LASTEXITCODE) : $o" }
          if (Test-Path out\tools\tamer_refused) { Fail "the Tamer wrote files while refusing" }
          Write-Host "::notice title=hiss tools smoke::scanner, combclick, airlab, inject, hash, pack and the Tamer refusal all ran on $($wav.Name)"
          Get-ChildItem out\tools | ForEach-Object { Write-Host $_.Name }
          $global:LASTEXITCODE = 0     # the Tamer exit code 3 above is the expected answer; do not let it become the step's result
          exit 0

      - name: Python check (separately written measurements)
        shell: pwsh
        run: |
          python -m pip install --quiet numpy matplotlib
          Push-Location hiss\python
          python hiss_compare.py ..\..\out\demo 2>&1 | Tee-Object -FilePath ..\..\out\python_compare.txt
          $code = $LASTEXITCODE
          python hiss_report.py ..\..\out\demo ..\..\out\test_log.txt ..\include\hybrid\hiss\HissConfig.hpp ..\..\out\report
          Pop-Location
          if ($code -ne 0) { throw "python check found a problem" }

      - name: Phase 1C synthetic checks (the parts that need no audio files)
        shell: pwsh
        run: |
          python -m pip install --quiet numpy scipy pyloudnorm
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress | Out-Null }
          $out = New-Object System.Collections.Generic.List[string]
          foreach ($n in 1,2,3) {
            $r = python -I hiss\python\phase1c\check$n.py $env:TEMP $env:TEMP synthetic 2>&1 | Select-Object -Last 1
            Write-Host $r; $out.Add([string]$r)
            if ($LASTEXITCODE -ne 0) { throw "Phase 1C synthetic check $n failed" }
          }
          Write-Host "::notice title=hiss: phase 1C synthetic checks::$($out -join '%0A')"

      - name: Summary (also published as a notice so it can be read without downloading)
        if: always()
        shell: pwsh
        run: |
          function Notice($title, $lines) {
            $t = ($lines -join "`n"); if ($t.Length -gt 3800) { $t = $t.Substring(0, 3800) }
            $enc = $t.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            Write-Host "::notice title=$title::$enc"
          }
          $warn = @(); if (Test-Path out\build_log.txt) { $warn = Select-String -Path out\build_log.txt -Pattern 'warning C\d+' | ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique }
          Notice "hiss: compiler warnings ($($warn.Count) unique)" ($warn | Select-Object -First 25)
          if (Test-Path out\test_log.txt) {
            $t = Get-Content out\test_log.txt
            Notice "hiss: tests" (@($t | Select-String -Pattern 'FAIL|checks,|latency') | ForEach-Object { $_.Line })
            Notice "hiss: measured" (@($t | Select-String -Pattern 'MEASURED') | ForEach-Object { $_.Line.Trim() })
          }
          foreach ($lf in "lab_test_log","tools_test_log","ui_test_log") {
            if (Test-Path "out\$lf.txt") {
              $t = Get-Content "out\$lf.txt"
              Notice "hiss: $lf" (@($t | Select-String -Pattern 'FAIL|checks,') | ForEach-Object { $_.Line })
              Notice "hiss: $lf measured" (@($t | Select-String -Pattern 'MEASURED') | ForEach-Object { $_.Line.Trim() })
            }
          }
          if (Test-Path out\python_compare.txt) { Notice "hiss: python check" (Get-Content out\python_compare.txt) }
          if (Test-Path out\demo\stems_report.txt) { }
          Get-ChildItem out\demo -Filter *_report.txt -ErrorAction SilentlyContinue | ForEach-Object { Notice ("hiss: " + $_.Name) (Get-Content $_.FullName) }

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hiss-tamer-results
          path: out
          if-no-files-found: warn
